name: TamaGoosie
options:
  bundleIdPrefix: com.tamagoosie
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  TamaGoosie:
    type: application
    platform: iOS
    sources:
      - TamaGoosie
      - Shared
    dependencies:
      - target: TamaGoosieWidgets
      - target: TamaGoosieWatch
        embed: true
      - target: TamaGoosieDeviceActivity
        embed: true
      - sdk: FamilyControls.framework
      - sdk: DeviceActivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamagoosie.app
        INFOPLIST_FILE: TamaGoosie/Info.plist
        SUPPORTS_LIVE_ACTIVITIES: true
    entitlements:
      path: TamaGoosie/TamaGoosie.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tamagoosie
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.family-controls: true

  TamaGoosieWatch:
    type: application
    platform: watchOS
    sources:
      - TamaGoosieWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamagoosie.app.watch
        INFOPLIST_FILE: TamaGoosieWatch/Info.plist
    entitlements:
      path: TamaGoosieWatch/TamaGoosieWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tamagoosie
        com.apple.developer.healthkit: true

  TamaGoosieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - TamaGoosieWidgets
      - Shared
      - path: TamaGoosie/Features/Goose/GooseLiveActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamagoosie.app.widgets
        INFOPLIST_FILE: TamaGoosieWidgets/Info.plist
    entitlements:
      path: TamaGoosieWidgets/TamaGoosieWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tamagoosie

  TamaGoosieDeviceActivity:
    type: app-extension
    platform: iOS
    sources:
      - TamaGoosieDeviceActivity
    dependencies:
      - sdk: DeviceActivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamagoosie.app.deviceactivity
        INFOPLIST_FILE: TamaGoosieDeviceActivity/Info.plist
    entitlements:
      path: TamaGoosieDeviceActivity/TamaGoosieDeviceActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tamagoosie
        com.apple.developer.family-controls: true

  TamaGoosieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TamaGoosieTests
    dependencies:
      - target: TamaGoosie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tamagoosie.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TamaGoosie:
    build:
      targets:
        TamaGoosie: all
        TamaGoosieWidgets: all
        TamaGoosieTests: testing
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TamaGoosieTests

  TamaGoosieWatch:
    build:
      targets:
        TamaGoosieWatch: all
    run:
      config: Debug
